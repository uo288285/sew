<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>MotoGP-Test</title>
    <meta name="author" content="Miguel Arias Guerrero" />
    <meta
      name="description"
      content="Configuración del test de la aplicación"
    />
    <meta
      name="keywords"
      content="MotoGP, base de datos, reiniciar, crear usuario"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../estilo/estilo.css" />
    <link rel="stylesheet" type="text/css" href="../estilo/layout.css" />
    <link rel="icon" href="multimedia/favicon.ico" />
  </head>

  <body>
    <header>
      <h1>MotoGP Desktop</h1>
    </header>
    <h2>Configuración del test:</h2>

    <form action="#" method="post">
      <input type="submit" name="reiniciar" value="Reiniciar BD" />
      <input type="submit" name="eliminar" value="Eliminar BD" />
      <input type="submit" name="crear" value="Crear Nueva BD" />
      <input type="submit" name="exportar" value="Exportar CSV" />
      <input type="submit" name="botonUsuario" value="Crear nuevo usuario " />
    </form>

    <form action="#" method="post" enctype="multipart/form-data">
      <label for="archivo">Selecciona el archivo CSV:</label>
      <input type="file" name="archivo" id="archivo" accept=".csv" />
      <button type="submit" name="importar">Importar CSV</button>
    </form>

    <form method="post">
      <h3>Introduce los datos del ususario</h3>
      <p>
        Género: <input type="radio" name="genero" value="Hombre" />Hombre
        <input type="radio" name="genero" value="Mujer" />Mujer
      </p>

      <p>Profesión: <input type="text" name="profesion" /></p>

      <p>Edad: <input type="text" name="edad" /></p>

      <p>Pericia informática: <input type="text" name="pericia" /></p>

      <p>
        Dispositivo:
        <input type="radio" name="dispositivo" value="ordenador" />Ordenador
        <input type="radio" name="dispositivo" value="tableta" />Tableta
        <input type="radio" name="dispositivo" value="telefono" />Telefono
      </p>

      <input type="submit" name="nuevoUsuario" value="Enviar a base de datos" />
    </form>
  </body>
</html>
