<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>MotoGP-Test</title>
    <meta name="author" content="Miguel Arias Guerrero" />
    <meta
      name="description"
      content="Test sobre la aplicación de MotoGP Desktop"
    />
    <meta name="keywords" content="MotoGP, respuesta, pregunta" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../estilo/estilo.css" />
    <link rel="stylesheet" type="text/css" href="../estilo/layout.css" />
    <link rel="icon" href="../multimedia/favicon.ico" />
  </head>

  <body>
    <header>
      <h1>MotoGP Desktop</h1>
    </header>
    <h2>Test sobre la aplicación</h2>
    <h3>Responde a las preguntas</h3>
    <form method="post">
      <p>
        <label for="respuesta1">¿Dónde nació el piloto Maverick Viñales?</label>
        <input type="text" name="respuesta[1]" id="respuesta1" />
      </p>

      <p>
        <label for="respuesta2"
          >¿En qué país se encuentra el circuito de Sepang?</label
        >
        <input type="text" name="respuesta[2]" id="respuesta2" />
      </p>

      <p>
        <label for="respuesta3"
          >¿Quién ganó la carrera en Sepang este año?</label
        >
        <input type="text" name="respuesta[3]" id="respuesta3" />
      </p>

      <p>
        <label for="respuesta4"
          >¿Después de la carrera que piloto iba primero en el mundial?</label
        >
        <input type="text" name="respuesta[4]" id="respuesta4" />
      </p>

      <p>
        <label for="respuesta5"
          >¿Qué día tuvo lugar la carrera de Sepang?</label
        >
        <input type="text" name="respuesta[5]" id="respuesta5" />
      </p>

      <p>
        <label for="respuesta6"
          >¿Cuánto tardó el ganador de la carrera del circuito de Sepang en
          cruzar la meta?</label
        >
        <input type="text" name="respuesta[6]" id="respuesta6" />
      </p>

      <p>
        <label for="respuesta7"
          >¿En qué año fue campeón del mundo Moto3 Maverick Viñales?</label
        >
        <input type="text" name="respuesta[7]" id="respuesta7" />
      </p>

      <p>
        <label for="respuesta8">¿Qué es una chicane?</label>
        <input type="text" name="respuesta[8]" id="respuesta8" />
      </p>

      <p>
        <label for="respuesta9"
          >¿Cuál es el gentilicio del país de la carrera?</label
        >
        <input type="text" name="respuesta[9]" id="respuesta9" />
      </p>

      <p>
        <label for="respuesta10"
          >¿En qué año nació el piloto Maverick Viñales?</label
        >
        <input type="text" name="respuesta[10]" id="respuesta10" />
      </p>

      <input type="submit" name="enviar" value="Terminar prueba" />
    </form>
  </body>
</html>
